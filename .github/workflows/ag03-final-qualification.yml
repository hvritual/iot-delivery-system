name: ag03-final-qualification
on:
  push:
    branches: [control/ag03-final-qualification-20260908]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 03db05c462cf71212da657db27746ec733688d80
          path: product
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.13'
          cache-dependency-path: product/backend-yunka/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: product/web/package-lock.json
      - name: Locked tools
        working-directory: product
        run: python3 ../control/control/ag03/run-step.py 'Locked tools and read-only bootstrap'
      - name: Exact local-Git compatibility correction
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 03db05c462cf71212da657db27746ec733688d80
          test -z "$(git status --porcelain)"
          git apply --index ../control/control/ag03/compat.patch
          test "$(git write-tree)" = 2c3a35a9be9bff332f7a9ce9e92e8b8b94a190e3
          git diff --cached --check
          export GIT_AUTHOR_NAME=hvritual GIT_COMMITTER_NAME=hvritual
          export GIT_AUTHOR_EMAIL=460657446@qq.com GIT_COMMITTER_EMAIL=460657446@qq.com
          export GIT_AUTHOR_DATE='1788867003 +0000' GIT_COMMITTER_DATE='1788867003 +0000'
          git -c commit.gpgsign=false commit -m 'fix(delivery): preserve legacy not-found ID collision semantics'
          test "$(git rev-parse HEAD)" = 59b31eb8302972fce8cef9f95cf81d926794198d
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ag03-evidence/candidate.txt"
      - name: Exact same legacy sentinel assertion RED and GREEN
        working-directory: product/backend-yunka
        shell: bash
        run: |
          set -euo pipefail
          file=internal/delivery/saved_view_service.go
          trap 'git restore -- "$file"' EXIT
          git show 03db05c462cf71212da657db27746ec733688d80:backend-yunka/internal/delivery/saved_view_service.go > "$file"
          set +e
          go test -mod=readonly -count=1 ./internal/delivery -run '^TestAG03SavedViewBehaviorParity/wrapped_not_found_compatibility$' > "$RUNNER_TEMP/ag03-evidence/sentinel-before-red.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'legacy not-found collision handling:' "$RUNNER_TEMP/ag03-evidence/sentinel-before-red.log"
          grep -q 'legacy empty views: delivery item not found' "$RUNNER_TEMP/ag03-evidence/sentinel-before-red.log"
          git restore -- "$file"
          trap - EXIT
          go test -mod=readonly -count=1 ./internal/delivery -run '^TestAG03SavedViewBehaviorParity/wrapped_not_found_compatibility$' > "$RUNNER_TEMP/ag03-evidence/sentinel-fixed-green.log"
          test -z "$(git status --porcelain)"
      - name: Unchanged old-base parity including the legacy sentinel
        working-directory: product
        run: python3 ../control/control/ag03/run-step.py 'Same behavior assertions against unchanged pre-refactor base'
      - name: Exact targeted checks and wide-object RED GREEN
        working-directory: product/backend-yunka
        run: python3 ../../control/control/ag03/run-step.py 'Exact targeted checks and real wide-object negative control'
      - name: Full existing regression and real runtime
        working-directory: product
        run: python3 ../control/control/ag03/run-step.py 'Existing complete regression and real runtime gates'
      - name: Verify named evidence and publish exact candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ag03-evidence"
          python3 - "$out" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);wanted={
           'TestYU15SavedViewCommitsBusinessOutboxAndAuditInRootTransaction',
           'TestYU15SavedViewOutboxFailureRollsBackBusinessAndAudit',
           'TestYU15SavedViewAuditFailureRollsBackBusinessAndOutbox',
           'TestYU15DirectSavedViewWriteFailsClosedWithTransactionalOutbox'}
          rows=[json.loads(x) for x in (p/'unchanged-transaction-audit.jsonl').read_text().splitlines()]
          assert not any(e['Action']=='fail' or (e['Action']=='skip' and e.get('Test')) for e in rows)
          assert wanted=={e['Test'] for e in rows if e['Action']=='pass' and e.get('Test')}
          rows=[json.loads(x) for x in (p/'baseline-behavior.jsonl').read_text().splitlines()]
          assert not any(e['Action']=='fail' or (e['Action']=='skip' and e.get('Test')) for e in rows)
          assert any(e['Action']=='pass' and e.get('Test')=='TestAG03SavedViewBehaviorParity/wrapped_not_found_compatibility' for e in rows)
          PY
          test "$(git rev-parse HEAD)" = 59b31eb8302972fce8cef9f95cf81d926794198d
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = f190fe237fa1efb738b4866275804093a209de5b
          current="$(git ls-remote origin refs/heads/feat/ag03-saved-view-narrow-usecase | cut -f1)"
          test "$current" = 03db05c462cf71212da657db27746ec733688d80 || test "$current" = 59b31eb8302972fce8cef9f95cf81d926794198d
          git push origin HEAD:refs/heads/feat/ag03-saved-view-narrow-usecase
          test "$(git ls-remote origin refs/heads/feat/ag03-saved-view-narrow-usecase | cut -f1)" = 59b31eb8302972fce8cef9f95cf81d926794198d
          git diff --binary f190fe237fa1efb738b4866275804093a209de5b HEAD > "$out/candidate.patch"
          git bundle create "$out/candidate.bundle" HEAD ^f190fe237fa1efb738b4866275804093a209de5b
          git bundle verify "$out/candidate.bundle"
          git diff --stat f190fe237fa1efb738b4866275804093a209de5b HEAD > "$out/diff-stat.txt"
          git status --porcelain --untracked-files=all > "$out/worktree.txt"
          printf '%s\n' 'QUALIFIED_TASK_BRANCH=59b31eb8302972fce8cef9f95cf81d926794198d' 'MAIN_NOT_MOVED=true' > "$out/result.txt"
      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ag03-evidence"
          cd "$RUNNER_TEMP/ag03-evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ag03-final-qualification
          path: ${{ runner.temp }}/ag03-evidence
          include-hidden-files: true
          if-no-files-found: error
