name: ag03-final-qualification
on:
  push:
    branches: [control/ag03-final-qualification-20260908]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 03db05c462cf71212da657db27746ec733688d80
          path: product
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.13'
          cache-dependency-path: product/backend-yunka/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: product/web/package-lock.json
      - name: Locked tools
        working-directory: product
        run: python3 ../control/control/ag03/run-step.py 'Locked tools and read-only bootstrap'
      - name: Recreate exact local-Git correction commits
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 03db05c462cf71212da657db27746ec733688d80
          test -z "$(git status --porcelain)"
          export GIT_AUTHOR_NAME=hvritual GIT_COMMITTER_NAME=hvritual
          export GIT_AUTHOR_EMAIL=460657446@qq.com GIT_COMMITTER_EMAIL=460657446@qq.com
          git apply --index ../control/control/ag03/compat.patch
          test "$(git write-tree)" = 2c3a35a9be9bff332f7a9ce9e92e8b8b94a190e3
          export GIT_AUTHOR_DATE='1788867003 +0000' GIT_COMMITTER_DATE='1788867003 +0000'
          git -c commit.gpgsign=false commit -m 'fix(delivery): preserve legacy not-found ID collision semantics'
          test "$(git rev-parse HEAD)" = 59b31eb8302972fce8cef9f95cf81d926794198d
          git apply --index ../control/control/ag03/startup.patch
          test "$(git write-tree)" = 0c0d1a2da23de4b7315245faba2103ec7a64377e
          git diff --cached --check
          export GIT_AUTHOR_DATE='1788867855 +0000' GIT_COMMITTER_DATE='1788867855 +0000'
          git -c commit.gpgsign=false commit -m 'fix(delivery): install bounded SQLite busy wait before startup pragmas'
          test "$(git rev-parse HEAD)" = bcd20632b666405c3f7a8fe8d53f591c78450087
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ag03-evidence/candidate.txt"
      - name: Existing startup bug exact old-base RED then corrected GREEN
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"; work="$(mktemp -d)"; out="$RUNNER_TEMP/ag03-evidence"
          trap 'git worktree remove --force "$work/base" >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          git worktree add --detach "$work/base" f190fe237fa1efb738b4866275804093a209de5b
          rmdir "$work/base/third_party/yunka"
          ln -s "$root/third_party/yunka" "$work/base/third_party/yunka"
          cp backend-yunka/internal/delivery/ag03_sqlite_startup_test.go "$work/base/backend-yunka/internal/delivery/ag03_sqlite_startup_test.go"
          set +e
          (cd "$work/base/backend-yunka" && go test -mod=readonly -race -json -count=3 ./internal/delivery -run '^TestAG03SQLiteStartupWaitsForExternalLock$') > "$out/startup-old-red.jsonl"
          code=$?
          set -e
          test "$code" -eq 1
          python3 - "$out/startup-old-red.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(x) for x in open(sys.argv[1])]
          failed=[r.get('Test') for r in rows if r['Action']=='fail' and r.get('Test')]
          assert failed==['TestAG03SQLiteStartupWaitsForExternalLock']*3,failed
          markers=[r for r in rows if 'AG03_STARTUP_BUSY_BEFORE_RELEASE: configure SQLite connection: database is locked (5) (SQLITE_BUSY)' in r.get('Output','')]
          assert len(markers)==3,len(markers)
          PY
          (cd backend-yunka && go test -mod=readonly -race -json -count=10 ./internal/delivery -run '^TestAG03SQLiteStartupWaitsForExternalLock$') > "$out/startup-fixed-repeat.jsonl"
          (cd backend-yunka && go test -mod=readonly -race -json -count=10 ./internal/bootstrap -run '^TestBootstrapSeedStagesCommittedOutboxEventsThenProjectsExactlyOnce$') > "$out/bootstrap-repeat.jsonl"
          python3 - "$out" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          for file,name in [('startup-fixed-repeat.jsonl','TestAG03SQLiteStartupWaitsForExternalLock'),('bootstrap-repeat.jsonl','TestBootstrapSeedStagesCommittedOutboxEventsThenProjectsExactlyOnce')]:
              rows=[json.loads(x) for x in (p/file).read_text().splitlines()]
              assert not any(r['Action']=='fail' or (r['Action']=='skip' and r.get('Test')) for r in rows)
              assert [r['Test'] for r in rows if r['Action']=='pass' and r.get('Test')]==[name]*10
          PY
      - name: Exact legacy sentinel RED and GREEN
        working-directory: product/backend-yunka
        shell: bash
        run: |
          set -euo pipefail
          file=internal/delivery/saved_view_service.go
          trap 'git restore -- "$file"' EXIT
          git show 03db05c462cf71212da657db27746ec733688d80:backend-yunka/internal/delivery/saved_view_service.go > "$file"
          set +e
          go test -mod=readonly -count=1 ./internal/delivery -run '^TestAG03SavedViewBehaviorParity/wrapped_not_found_compatibility$' > "$RUNNER_TEMP/ag03-evidence/sentinel-before-red.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'legacy not-found collision handling:' "$RUNNER_TEMP/ag03-evidence/sentinel-before-red.log"
          grep -q 'legacy empty views: delivery item not found' "$RUNNER_TEMP/ag03-evidence/sentinel-before-red.log"
          git restore -- "$file"
          trap - EXIT
          go test -mod=readonly -count=1 ./internal/delivery -run '^TestAG03SavedViewBehaviorParity/wrapped_not_found_compatibility$' > "$RUNNER_TEMP/ag03-evidence/sentinel-fixed-green.log"
      - name: Same saved-view assertions on unchanged base
        working-directory: product
        run: python3 ../control/control/ag03/run-step.py 'Same behavior assertions against unchanged pre-refactor base'
      - name: Exact targeted checks and wide-object RED GREEN
        working-directory: product/backend-yunka
        run: python3 ../../control/control/ag03/run-step.py 'Exact targeted checks and real wide-object negative control'
      - name: Full existing regression and real runtime
        working-directory: product
        run: python3 ../control/control/ag03/run-step.py 'Existing complete regression and real runtime gates'
      - name: Verify complete evidence and publish only exact qualified branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ag03-evidence"
          python3 - "$out" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);all_names=[]
          for f in ['targeted.jsonl','unchanged-transaction-audit.jsonl']:
              rows=[json.loads(x) for x in (p/f).read_text().splitlines()]
              assert not any(e['Action']=='fail' or (e['Action']=='skip' and e.get('Test')) for e in rows)
              all_names += [e['Test'] for e in rows if e['Action']=='pass' and e.get('Test')]
          required={'TestAG03SQLiteStartupWaitsForExternalLock','TestYU15SavedViewCommitsBusinessOutboxAndAuditInRootTransaction','TestYU15SavedViewOutboxFailureRollsBackBusinessAndAudit','TestYU15SavedViewAuditFailureRollsBackBusinessAndOutbox','TestYU15DirectSavedViewWriteFailsClosedWithTransactionalOutbox'}
          assert required<=set(all_names),required-set(all_names)
          assert len(all_names)==20,len(all_names)
          PY
          test "$(git rev-parse HEAD)" = bcd20632b666405c3f7a8fe8d53f591c78450087
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = f190fe237fa1efb738b4866275804093a209de5b
          current="$(git ls-remote origin refs/heads/feat/ag03-saved-view-narrow-usecase | cut -f1)"
          test "$current" = 03db05c462cf71212da657db27746ec733688d80 || test "$current" = bcd20632b666405c3f7a8fe8d53f591c78450087
          git push origin HEAD:refs/heads/feat/ag03-saved-view-narrow-usecase
          test "$(git ls-remote origin refs/heads/feat/ag03-saved-view-narrow-usecase | cut -f1)" = bcd20632b666405c3f7a8fe8d53f591c78450087
          git diff --binary f190fe237fa1efb738b4866275804093a209de5b HEAD > "$out/candidate.patch"
          git bundle create "$out/candidate.bundle" HEAD ^f190fe237fa1efb738b4866275804093a209de5b
          git bundle verify "$out/candidate.bundle"
          git diff --stat f190fe237fa1efb738b4866275804093a209de5b HEAD > "$out/diff-stat.txt"
          git status --porcelain --untracked-files=all > "$out/worktree.txt"
          printf '%s\n' 'QUALIFIED_TASK_BRANCH=bcd20632b666405c3f7a8fe8d53f591c78450087' 'MAIN_NOT_MOVED=true' > "$out/result.txt"
      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ag03-evidence"
          cd "$RUNNER_TEMP/ag03-evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ag03-final-qualification
          path: ${{ runner.temp }}/ag03-evidence
          include-hidden-files: true
          if-no-files-found: error
