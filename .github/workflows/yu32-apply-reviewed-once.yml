name: YU-32 apply reviewed repair once

on:
  push:
    branches: [codex/yu-32-independent-security-architecture-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply only the reviewed consumer boundary patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f yu32-reviewed.patch ]; then
            echo 'reviewed patch already consumed'
            exit 0
          fi
          test -z "$(grep '^diff --git ' yu32-reviewed.patch | grep -Ev '^diff --git a/backend-yunka/internal/delivery/application/adapter.go b/backend-yunka/internal/delivery/application/adapter.go$|^diff --git a/backend-yunka/scripts/run-yu30-governance.sh b/backend-yunka/scripts/run-yu30-governance.sh$' || true)"
          git apply --check yu32-reviewed.patch
          git apply yu32-reviewed.patch
          git rm yu32-reviewed.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-yunka/internal/delivery/application/adapter.go backend-yunka/scripts/run-yu30-governance.sh
          git commit -m 'fix(yu-32): apply reviewed authorization boundary repair'
          git push origin HEAD:codex/yu-32-independent-security-architecture-review
