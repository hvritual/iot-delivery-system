name: Proto contract modularization carrier

on:
  push:
    branches: [transfer/proto-mod-source-20260906]
    paths:
      - .transfer/proto_modularize.py
      - .github/workflows/proto-modularization-carrier.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout carrier definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: transfer/proto-mod-source-20260906
          path: carrier
          persist-credentials: false

      - name: Checkout exact consumer task branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/proto-contract-modularization
          path: target
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Assert frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = 0cce352a58d72a6b60d847e4009f1a9c0fe56ba7
          test "$(git -C target ls-tree HEAD -- third_party/yunka | awk '{print $3}')" = 057ebcf88a87303eb633eb6e604d306f633dfac0
          test "$(git -C target/third_party/yunka rev-parse HEAD)" = 057ebcf88a87303eb633eb6e604d306f633dfac0

      - name: Install canonical Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: true
          cache-dependency-path: target/backend-yunka/go.sum

      - name: Install pinned protobuf compiler and plugins
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/proto-tools"
          mkdir -p "$tools/protoc-21.12" "$tools/bin"
          curl --fail --location --retry 3 --output "$tools/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          unzip -q "$tools/protoc.zip" -d "$tools/protoc-21.12"
          GOBIN="$tools/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          GOBIN="$tools/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "TOOLS_DIR=$tools" >> "$GITHUB_ENV"

      - name: Split one business proto into bounded-context files
        shell: bash
        run: |
          set -euo pipefail
          python3 carrier/.transfer/proto_modularize.py target | tee "$RUNNER_TEMP/proto-layout.json"
          test ! -e target/backend-yunka/contracts/proto/iot_delivery.proto
          test ! -e target/backend-yunka/contracts/proto/yunka_bootstrap.proto
          test -e target/backend-yunka/contracts/proto/delivery/v1/delivery_service.proto
          test "$(find target/backend-yunka/contracts/proto/delivery/v1 -maxdepth 1 -name '*.proto' | wc -l)" -eq 8

      - name: Generate with pinned Yunka and prove semantic operation identity
        shell: bash
        run: |
          set -euo pipefail
          make -C target/backend-yunka GO="$(command -v go)" TOOLS_DIR="$TOOLS_DIR" yunka-generate
          make -C target/backend-yunka GO="$(command -v go)" TOOLS_DIR="$TOOLS_DIR" yunka-check
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('target')
          old = json.loads((root / '.proto-mod-baseline-manifest.json').read_text())
          new = json.loads((root / 'backend-yunka/contracts/generated/manifest.json').read_text())
          def op_map(doc):
              ops = doc.get('operations', [])
              return {op['id']: {k:v for k,v in op.items() if k not in {'file','path','source','sourceFile','source_file'}} for op in ops}
          before = op_map(old)
          after = op_map(new)
          if len(before) != 25 or len(after) != 25:
              raise SystemExit(f'operation count changed: {len(before)} -> {len(after)}')
          if before != after:
              missing = sorted(set(before) - set(after))
              added = sorted(set(after) - set(before))
              changed = sorted(k for k in before.keys() & after.keys() if before[k] != after[k])
              raise SystemExit(f'operation semantics changed missing={missing} added={added} changed={changed}')
          def msg_map(doc):
              return {m['fullName']: {k:v for k,v in m.items() if k not in {'file','path','source','sourceFile','source_file'}} for m in doc.get('messages', [])}
          bm, am = msg_map(old), msg_map(new)
          if bm != am:
              missing = sorted(set(bm) - set(am))
              added = sorted(set(am) - set(bm))
              changed = sorted(k for k in bm.keys() & am.keys() if bm[k] != am[k])
              raise SystemExit(f'message semantics changed missing={missing} added={added} changed={changed}')
          print(f'PROTO SEMANTICS PRESERVED: {len(before)} operations, {len(bm)} messages')
          PY

      - name: Commit generated modularized contract without carrier files
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          rm -f .proto-mod-baseline-manifest.json .proto-mod-layout.json
          git diff --check
          git status --short
          test -z "$(git status --porcelain -- third_party/yunka)"
          git config user.name 'AI Assistant'
          git config user.email 'ai-assistant@users.noreply.github.com'
          git add -A backend-yunka/contracts
          git diff --cached --quiet && { echo 'expected contract changes'; exit 1; }
          git commit -m 'refactor(proto): modularize delivery contract by bounded context'
          git push origin HEAD:refs/heads/codex/proto-contract-modularization
          git rev-parse HEAD | tee "$RUNNER_TEMP/candidate-head.txt"

      - name: Preserve carrier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proto-modularization-carrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proto-layout.json
            ${{ runner.temp }}/candidate-head.txt
          if-no-files-found: warn
          retention-days: 7
