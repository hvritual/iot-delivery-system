name: YU-31 transfer local commit
on:
  push:
    branches: [codex/yu-31-transfer-01]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Import reviewed local Git bundle only after checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, os, json, base64, hashlib
          url='https://api.github.com/repos/hvritual/iot-delivery-system/git/blobs/3d1cd52bd600f6a6a517347d8ad519d9682d43b3'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          raw=base64.b64decode(json.load(urllib.request.urlopen(req))['content'])
          # Explicit replacement of a damaged transfer suffix; the complete bundle
          # must match the original local SHA-256 before Git imports any object.
          tail=''
          raw=raw[:12000]+base64.b64decode(tail)
          assert hashlib.sha256(raw).hexdigest()=='608192a9ef5fd15e5932a57e9afa36a50e35dee7a0a01007fe2b34969f7d0f75', 'bundle transport corruption'
          open(os.environ['RUNNER_TEMP']+'/yu31.bundle','wb').write(raw)
          PY
          git bundle verify "$RUNNER_TEMP/yu31.bundle"
          git fetch "$RUNNER_TEMP/yu31.bundle" HEAD
          head=ab85026e15186e9101d38810b4a0168cb1b2ec7c
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          test "$(git rev-parse "$head^")" = 0501bd4b2295c624b817e28a94eb1f62b08b0d4c
          test -z "$(git diff --name-only "$head^" "$head" -- third_party backend backend-yunka/contracts backend-yunka/internal web)"
          git diff --check "$head^" "$head"
          git push origin "$head:refs/heads/codex/yu-31-import-ab85026"
          echo "Imported exact locally committed object: $head; main and task refs not modified"
