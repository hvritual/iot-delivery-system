name: YU-31 transfer local commit
on:
  push:
    branches: [codex/yu-31-transfer-01]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reassemble exact locally committed bundle and validate scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, os, json, base64, hashlib
          ids=['bf07d8146487ae94a101fe1b7a658394e48dedd7','d0ea431727ba1a8a41bbe8e97abe970f353b85e4','a1998314e223b26f9e6abc8969a981acda580105','5b019f92fb58b9fde738727a041b437416780a6d']
          chunks=[]
          for sha in ids:
            url='https://api.github.com/repos/hvritual/iot-delivery-system/git/blobs/'+sha
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            chunks.append(base64.b64decode(json.load(urllib.request.urlopen(req))['content']))
          # Two identified transfer insertions are reversed. Both the reconstructed
          # first chunk's Git hash and the entire original bundle's SHA-256 must
          # match independently recorded local identities before importing objects.
          encoded=base64.b64encode(chunks[0]).decode().rstrip('=')
          encoded=encoded.replace('Z92rZCP9','Z92rCP9').replace('luWuz3L','luWz3L')
          encoded=encoded[:-4]+'338t'
          chunks[0]=base64.b64decode(encoded)
          assert hashlib.sha1(b'blob '+str(len(chunks[0])).encode()+b'\0'+chunks[0]).hexdigest()=='1785a583b879b45c8af6cecbaf1d09dd5308782d'
          raw=b''.join(chunks)
          assert hashlib.sha256(raw).hexdigest()=='2c75e640a2c5f43c9dd3792b7c2641d3d8042f9a6eadca75fe41b29643a02667'
          open(os.environ['RUNNER_TEMP']+'/yu31.bundle','wb').write(raw)
          PY
          git bundle verify "$RUNNER_TEMP/yu31.bundle"
          git fetch "$RUNNER_TEMP/yu31.bundle" HEAD
          head=20520f69d7eaf3c27c0fb3e9d79f03b4ecb059bd
          parent=9d552633e2b50110d3a74b4d1d3c0b02f4099bb4
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          test "$(git rev-parse "$head^")" = "$parent"
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','9d552633e2b50110d3a74b4d1d3c0b02f4099bb4','20520f69d7eaf3c27c0fb3e9d79f03b4ecb059bd'],text=True).splitlines())
          allowed={'backend-yunka/tests/runtime/process_test.go','backend-yunka/tests/runtime/smoke_test.go','docs/target/yunka-upgrade/TASKS.md','docs/target/yunka-upgrade/YU-31-EVIDENCE.md','docs/target/yunka-upgrade/YU-31-FRAMEWORK-PROBLEMS.json','docs/target/yunka-upgrade/YU-31-CI-RECEIPT.json'}
          assert paths==allowed
          PY
          git diff --check "$parent" "$head"
          test "$(git ls-remote origin refs/heads/codex/yu-31-import-20520f6 | cut -f1)" = "$parent"
          git push origin "$head:refs/heads/codex/yu-31-import-20520f6"
          echo "Imported exact local commit $head; task/main refs unchanged"
