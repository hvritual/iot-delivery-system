name: YU-31 transfer local commit
on:
  push:
    branches: [codex/yu-31-transfer-01]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: backend-yunka/go.sum
      - name: Verify local object and exact consumer-only scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yu31-repair"
          python3 - <<'PY'
          import urllib.request, os, json, base64, hashlib
          url='https://api.github.com/repos/hvritual/iot-delivery-system/git/blobs/dffc0165a4bfc1445baa2ade7f463a53c4caa332'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          raw=base64.b64decode(json.load(urllib.request.urlopen(req))['content'])
          assert hashlib.sha256(raw).hexdigest()=='69d00fb602b269fcfb4f799c3d226765053bec0b4b7b957bdf2ccce7b64d0bb2'
          open(os.environ['RUNNER_TEMP']+'/yu31.bundle','wb').write(raw)
          PY
          git bundle verify "$RUNNER_TEMP/yu31.bundle"
          git fetch "$RUNNER_TEMP/yu31.bundle" HEAD
          head=9d552633e2b50110d3a74b4d1d3c0b02f4099bb4
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          test "$(git rev-parse "$head^")" = ab85026e15186e9101d38810b4a0168cb1b2ec7c
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','ab85026e15186e9101d38810b4a0168cb1b2ec7c','9d552633e2b50110d3a74b4d1d3c0b02f4099bb4'],text=True).splitlines())
          assert changed=={'backend-yunka/internal/bootstrap/application.go','backend-yunka/internal/bootstrap/yu31_optional_legacy_auth_test.go'}
          PY
          git checkout --detach "$head"
          git diff --check "$head^" "$head"
      - name: Prove startup RED on parent and GREEN on exact local repair
        run: |
          set -euo pipefail
          head=9d552633e2b50110d3a74b4d1d3c0b02f4099bb4
          path=backend-yunka/internal/bootstrap/application.go
          git show "$head^:$path" > "$path"
          set +e
          go -C backend-yunka test -mod=readonly -count=1 -run '^TestYU31LocalMemberRuntimeDoesNotRequireDevelopmentAPIKey$' ./internal/bootstrap > "$RUNNER_TEMP/yu31-repair/parent-red.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/yu31-repair/parent-red.log"
          test "$code" -ne 0
          grep -F 'local API key environment is required' "$RUNNER_TEMP/yu31-repair/parent-red.log"
          git restore --source="$head" -- "$path"
          go -C backend-yunka test -mod=readonly -count=1 -run '^TestYU31LocalMemberRuntimeDoesNotRequireDevelopmentAPIKey$' ./internal/bootstrap 2>&1 | tee "$RUNNER_TEMP/yu31-repair/fix-green.log"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/yu31-repair/head.txt"
          # The target already exists at the reviewed parent. No workflow change,
          # force push, task ref write, or main write is performed by this token.
          test "$(git ls-remote origin refs/heads/codex/yu-31-import-9d55263 | cut -f1)" = ab85026e15186e9101d38810b4a0168cb1b2ec7c
          git push origin "$head:refs/heads/codex/yu-31-import-9d55263"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yu31-startup-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/yu31-repair/
          retention-days: 14
          if-no-files-found: error
