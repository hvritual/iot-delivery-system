name: yunka-149-nested-project

on:
  push:
    branches:
      - qualification/149-nested-project-git-paths
    paths:
      - .github/workflows/yunka-149-nested-project.yml
      - .github/qualification/yunka-149-nested-project-pressure.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-project-git-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 97e2c8fe44d804eeb6819e75fc78f11d1a53b6c3
      CONSUMER_RED_PARENT: 3b84d2a420d1931087ee0717b5bb64126a388592
    steps:
      - name: Checkout nested-project qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Capture pristine consumer status
        shell: bash
        run: |
          set -euo pipefail
          git -C consumer status --porcelain > "$RUNNER_TEMP/consumer-before.status"
          test ! -s "$RUNNER_TEMP/consumer-before.status"
          test -f consumer/backend-yunka/.yunka/project.json
          test ! -f consumer/.yunka/project.json
          git -C consumer merge-base --is-ancestor "$CONSUMER_RED_PARENT" HEAD
          changed="$(git -C consumer diff --name-only "$CONSUMER_RED_PARENT"...HEAD)"
          expected=$'.github/qualification/yunka-149-nested-project-pressure.sh\n.github/workflows/yunka-149-nested-project.yml'
          test "$changed" = "$expected"

      - name: Checkout exact Yunka issue 149 candidate outside consumer repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka-candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Bind preserved nested module to exact candidate without dirtying tracked submodule
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka-candidate rev-parse HEAD)" = "$YUNKA_SHA"
          test "$(git -C consumer ls-tree HEAD third_party/yunka | awk '{print $1" "$3}')" = "160000 057ebcf88a87303eb633eb6e604d306f633dfac0"
          go -C consumer/backend-yunka mod edit \
            -replace=github.com/hvritual/yunka.io/framework=../../yunka-candidate/framework \
            -replace=github.com/hvritual/yunka.io/gateway=../../yunka-candidate/gateway \
            -replace=github.com/hvritual/yunka.io/pkg=../../yunka-candidate/pkg
          git -C consumer status --porcelain > "$RUNNER_TEMP/candidate-binding.status"
          grep -qx ' M backend-yunka/go.mod' "$RUNNER_TEMP/candidate-binding.status"
          if grep -q 'third_party/yunka' "$RUNNER_TEMP/candidate-binding.status"; then
            echo "tracked Yunka submodule must remain untouched by qualification" >&2
            exit 1
          fi

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka-candidate/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka-candidate rpc-tools
          echo "$GITHUB_WORKSPACE/yunka-candidate/.yunka/bin" >> "$GITHUB_PATH"

      - name: Build exact Yunka candidate CLI
        shell: bash
        run: |
          set -euo pipefail
          go -C yunka-candidate/app build -o "$RUNNER_TEMP/yunka" ./cmd
          "$RUNNER_TEMP/yunka" audit --help >/dev/null
          "$RUNNER_TEMP/yunka" change set check --help >/dev/null

      - name: Execute original nested-project pressure
        shell: bash
        env:
          YUNKA_BIN: ${{ runner.temp }}/yunka
          YUNKA_ROOT: ${{ github.workspace }}/yunka-candidate
          REPO: ${{ github.workspace }}/consumer
          ROOT: ${{ github.workspace }}/consumer/backend-yunka
          EVIDENCE: ${{ runner.temp }}/yunka-149-evidence
          # The historical superproject workspace also includes the legacy
          # `backend` module, whose obsolete go-kit compatibility replace is
          # unrelated to the nested `backend-yunka` pressure. Run the preserved
          # nested module in its own canonical module context instead of editing
          # that sibling historical module.
          GOWORK: off
        run: |
          set -euo pipefail
          bash consumer/.github/qualification/yunka-149-nested-project-pressure.sh

      - name: Restore historical consumer checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C consumer reset --hard "$GITHUB_SHA"
          git -C consumer clean -fdx
          git -C consumer status --porcelain > "$RUNNER_TEMP/consumer-after.status"
          diff -u "$RUNNER_TEMP/consumer-before.status" "$RUNNER_TEMP/consumer-after.status"

      - name: Upload issue 149 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yunka-149-nested-project
          path: ${{ runner.temp }}/yunka-149-evidence
          if-no-files-found: warn
          retention-days: 3
