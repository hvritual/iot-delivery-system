name: ag03-source
on:
  push:
    branches: [control/ag03-source-20260908]
    paths: [.github/workflows/ag03-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f190fe237fa1efb738b4866275804093a209de5b
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f190fe237fa1efb738b4866275804093a209de5b
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/ag03-source"
          git bundle create "$RUNNER_TEMP/ag03-source/iot.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/ag03-source/iot.bundle"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ag03-source/identity.txt"
          cd "$RUNNER_TEMP/ag03-source"
          sha256sum iot.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag03-source
          path: ${{ runner.temp }}/ag03-source
          retention-days: 7
          if-no-files-found: error
