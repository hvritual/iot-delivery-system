name: Proto modularization ownership reconcile

on:
  push:
    branches: [transfer/proto-mod-source-20260906]
    paths: [.github/workflows/proto-modularization-reconcile.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/proto-contract-modularization
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Assert exact task/framework source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 19db12d7ff59b2e58a65052db6d697019d735894
          test "$(git ls-tree HEAD -- third_party/yunka | awk '{print $3}')" = 057ebcf88a87303eb633eb6e604d306f633dfac0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: true
          cache-dependency-path: backend-yunka/go.sum

      - name: Install pinned protobuf compiler and plugins
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/proto-tools"
          mkdir -p "$tools/protoc-21.12" "$tools/bin"
          curl --fail --location --retry 3 --output "$tools/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          unzip -q "$tools/protoc.zip" -d "$tools/protoc-21.12"
          GOBIN="$tools/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          GOBIN="$tools/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "TOOLS_DIR=$tools" >> "$GITHUB_ENV"

      - name: Regenerate and require ownership-manifest-only drift
        shell: bash
        run: |
          set -euo pipefail
          make -C backend-yunka GO="$(command -v go)" TOOLS_DIR="$TOOLS_DIR" yunka-generate
          make -C backend-yunka GO="$(command -v go)" TOOLS_DIR="$TOOLS_DIR" yunka-check
          git diff --check
          changed="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$changed"
          test "$changed" = ' M .yunka/protobuf-go.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.yunka/protobuf-go.json')
          data=json.loads(p.read_text())
          expected=[
            'backend-yunka/contracts/delivery/v1/common.pb.go',
            'backend-yunka/contracts/delivery/v1/dashboard.pb.go',
            'backend-yunka/contracts/delivery/v1/delivery_service.pb.go',
            'backend-yunka/contracts/delivery/v1/delivery_service_grpc.pb.go',
            'backend-yunka/contracts/delivery/v1/notification.pb.go',
            'backend-yunka/contracts/delivery/v1/planning.pb.go',
            'backend-yunka/contracts/delivery/v1/project.pb.go',
            'backend-yunka/contracts/delivery/v1/saved_view.pb.go',
            'backend-yunka/contracts/delivery/v1/work_item.pb.go',
          ]
          if data.get('schemaVersion') != 1 or data.get('files') != expected:
              raise SystemExit(f'unexpected protobuf ownership manifest: {data}')
          print('OWNERSHIP MANIFEST RECONCILED: 9 files')
          PY

      - name: Commit only managed ownership manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Assistant'
          git config user.email 'ai-assistant@users.noreply.github.com'
          git add .yunka/protobuf-go.json
          test "$(git diff --cached --name-only)" = '.yunka/protobuf-go.json'
          git commit -m 'chore(proto): reconcile protobuf generated ownership manifest'
          git push origin HEAD:refs/heads/codex/proto-contract-modularization
          git rev-parse HEAD
