name: YU-32 hardening source transfer
on:
  push:
    branches: [transfer/yu32-hardening-20260906]
    paths: [.github/workflows/yu32-hardening-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Import only exact locally committed CAS repair
        shell: bash
        run: |
          set -euo pipefail
          sed -e 's/tVKVuYYHx/tVKVuYHx/' -e 's/demMLjTWk/demMLjwk/' -e 's/JBaBv+wKLE/JBaBv+wKJE/' .transfer/yu32h-cas-fix.b64 | base64 --decode > "$RUNNER_TEMP/repair.bundle"
          echo '7f8144263eb1a3c47031a0381975a2e7e3039d679ab78a0c30ffb14e425c8bc2  '"$RUNNER_TEMP/repair.bundle" | sha256sum --check --strict
          git bundle verify "$RUNNER_TEMP/repair.bundle"
          git fetch "$RUNNER_TEMP/repair.bundle" HEAD
          head=0a83eabea5766a0c4fc64fc84c914140036fd3df
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          test "$(git rev-parse "$head^1")" = 1797390722b02c31e2fdad7aaf4b5d962dfc0096
          test -z "$(git diff --name-only "$head^1" "$head" -- .github/workflows/ third_party/yunka backend/)"
          git push origin "$head":refs/heads/transfer/yu32h-objects
