name: YU-30 apply reviewed fixes
on:
  push:
    branches: [codex/yu-30-full-regression]
    paths: [.github/workflows/yu30-apply-reviewed.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'hvritual/iot-delivery-system' && github.ref == 'refs/heads/codex/yu-30-full-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply reviewed source fixes and resolve advisory-backed Next update
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f3ec66ea1c442f27d79d61b65d3b1dfe7ed0ed9e HEAD
          test "$(git ls-remote origin refs/heads/codex/yu-30-full-regression | cut -f1)" = "$(git rev-parse HEAD)"
          git apply --check .github/yu30-reviewed.patch
          git apply .github/yu30-reviewed.patch
          cd web
          npm install --package-lock-only --ignore-scripts --save-exact next@16.3.4
          npm audit --json --audit-level=high
          cd ..
          git diff --check
          git diff --stat
          test -z "$(git diff --name-only -- third_party backend-yunka/contracts/generated backend-yunka/contracts/proto)"
          git rm .github/yu30-reviewed.patch .github/workflows/yu30-apply-reviewed.yml
          git add backend-yunka/internal/bootstrap/application.go backend-yunka/internal/bootstrap/application_test.go backend-yunka/internal/locallogin/locallogin_test.go backend-yunka/yu24_permission_dictionary_test.go web/components/local-auth-shell.tsx web/e2e/yu29-authorization-stage.mjs web/package.json web/package-lock.json
          git -c user.name="$(git log -1 --format=%an)" -c user.email="$(git log -1 --format=%ae)" commit -m "fix(yu-30): repair executable identity fixtures and browser certification; update vulnerable Next dependency"
          git push origin HEAD:refs/heads/codex/yu-30-full-regression
          git rev-parse HEAD
