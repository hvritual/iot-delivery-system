name: YU-30 apply reviewed fixes
on:
  push:
    branches: [codex/yu-30-full-regression]
    paths: [.github/workflows/yu30-apply-reviewed.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'hvritual/iot-delivery-system' && github.ref == 'refs/heads/codex/yu-30-full-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed gate and fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 04ffc65625b66be5f95aa50ee17554a57bb3faa6 HEAD
          test "$(git ls-remote origin refs/heads/codex/yu-30-full-regression | cut -f1)" = "$(git rev-parse HEAD)"
          git apply --check .github/yu30-reviewed.patch
          git apply .github/yu30-reviewed.patch
          git diff --check
          git diff --stat
          test -z "$(git diff --name-only -- third_party backend-yunka/contracts/generated backend-yunka/contracts/proto)"
          git rm .github/yu30-reviewed.patch .github/workflows/yu30-apply-reviewed.yml
          git add backend-yunka/internal/localbootstrap/localbootstrap_test.go backend-yunka/internal/locallogin/locallogin_test.go backend-yunka/no_bypass_guard_test.go web/e2e/yu29-authorization-stage.mjs
          git -c user.name="$(git log -1 --format=%an)" -c user.email="$(git log -1 --format=%ae)" commit -m "test(yu-30): repair real session fixtures and make boundary gates domain-aware"
          git push origin HEAD:refs/heads/codex/yu-30-full-regression
          git rev-parse HEAD
