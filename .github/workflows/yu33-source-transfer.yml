name: YU-33 exact documentation commit transfer
on:
  push:
    branches: [transfer/yu33-source-20260906]
    paths: [.github/workflows/yu33-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: AI Assistant
      GIT_AUTHOR_EMAIL: ai-assistant@users.noreply.github.com
      GIT_COMMITTER_NAME: AI Assistant
      GIT_COMMITTER_EMAIL: ai-assistant@users.noreply.github.com
      GIT_AUTHOR_DATE: '2026-09-06T03:54:28+00:00'
      GIT_COMMITTER_DATE: '2026-09-06T03:54:28+00:00'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact locally authored documentation commit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/yu33-documentation"
          mkdir -p "$out"
          cp .transfer/yu33_docs.py "$RUNNER_TEMP/yu33_docs.py"
          cp .transfer/yu33_verify.py "$out/verify_docs.py"
          test "$(git hash-object "$RUNNER_TEMP/yu33_docs.py")" = 29b5fcc2e4669e0ab8fa23a32b5bc809341da071
          test "$(git hash-object "$out/verify_docs.py")" = 2d3dc61aac9559729d379a3db5732e9775ec7637
          echo '104e2cb5b2f281e1750e4f1c256ad995316dbfb6836e4419452326172e12300d  '"$RUNNER_TEMP/yu33_docs.py" | sha256sum --check --strict
          echo 'b1f7b8c58d7a7970ab63e33f0ec272ff622c05b39ac7d4bb3a1427ce39a67771  '"$out/verify_docs.py" | sha256sum --check --strict
          git checkout --detach 1da771dac46c1b10c2ea54a0fb4559316c20179b
          python3 "$RUNNER_TEMP/yu33_docs.py"
          python3 "$out/verify_docs.py" > "$out/precommit-check.json"
          git add README.md backend-yunka/README.md docs/ARCHITECTURE.md docs/SOURCE-MANIFEST.md docs/YUNKA-MVP-MIGRATION.md docs/target/yunka-upgrade/TASKS.md docs/target/yunka-upgrade/RESIDUAL-RISKS.md docs/target/yunka-upgrade/YU-33-EVIDENCE.md docs/target/yunka-upgrade/FINAL-MANIFEST.json
          git commit -m 'docs(yu33): reconcile operating truth and close upgrade delivery ledger'
          test "$(git rev-parse HEAD)" = 0cce352a58d72a6b60d847e4009f1a9c0fe56ba7
          test "$(git rev-parse HEAD^{tree})" = b89bc92e8839d23470bc629313208771f6ad0e6f
          python3 "$out/verify_docs.py" 0cce352a58d72a6b60d847e4009f1a9c0fe56ba7 > "$out/documentation-check.json"
          git rev-parse HEAD > "$out/head.txt"
          git status --porcelain --untracked-files=all > "$out/worktree.txt"
          git diff --binary > "$out/worktree.patch"
          test ! -s "$out/worktree.txt"
          test ! -s "$out/worktree.patch"
          git push origin HEAD:refs/heads/codex/yu-33-final-closeout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yu33-documentation-check
          path: ${{ runner.temp }}/yu33-documentation/
          retention-days: 14
          if-no-files-found: error
