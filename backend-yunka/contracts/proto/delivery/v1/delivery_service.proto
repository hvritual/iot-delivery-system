syntax = "proto3";

package iot.delivery.v1;

import "yunka/dsl/v1/options.proto";
import "delivery/v1/common.proto";
import "delivery/v1/work_item.proto";
import "delivery/v1/project.proto";
import "delivery/v1/planning.proto";
import "delivery/v1/dashboard.proto";
import "delivery/v1/saved_view.proto";
import "delivery/v1/notification.proto";

option go_package = "github.com/hvritual/iot-delivery-system/backend-yunka/contracts/delivery/v1;deliveryv1";
option (yunka.dsl.v1.domain) = { name: "delivery" version: "v1" };

// DeliveryService remains the single transport-neutral service identity.
// DTO/schema ownership is split by bounded context to improve review and AI context locality.
service DeliveryService {
  option (yunka.dsl.v1.application) = {
    name: "management"
    capabilities: {
      name: "sqlite.transaction-factory"
      go_package: "github.com/hvritual/iot-delivery-system/backend-yunka/internal/localtx"
      go_type: "Factory"
    }
    capabilities: {
      name: "delivery.outbox"
      go_package: "github.com/hvritual/iot-delivery-system/backend-yunka/internal/deliveryruntime"
      go_type: "Outbox"
    }
    capabilities: {
      name: "delivery.notifications"
      go_package: "github.com/hvritual/iot-delivery-system/backend-yunka/internal/deliveryruntime"
      go_type: "Notifications"
    }
    capabilities: {
      name: "delivery.projection"
      go_package: "github.com/hvritual/iot-delivery-system/backend-yunka/internal/deliveryruntime"
      go_type: "Projection"
    }
  };

  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.dashboard.get"
      use_case: "get_dashboard"
      permissions: "delivery.dashboard.read"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      authentication: AUTHENTICATION_SERVICE
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }
