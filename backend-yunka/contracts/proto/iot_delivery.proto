syntax = "proto3";

package iot.delivery.v1;

import "google/protobuf/timestamp.proto";
import "yunka/dsl/v1/options.proto";

option go_package = "github.com/hvritual/iot-delivery-system/backend-yunka/contracts/delivery/v1;deliveryv1";
option (yunka.dsl.v1.domain) = { name: "delivery" version: "v1" };

// DeliveryService is the transport-neutral contract for the existing desktop
// MVP. HTTP remains the compatibility adapter; generated gRPC types establish
// an explicit evolution boundary for future integrations.
service DeliveryService {
  option (yunka.dsl.v1.application) = { name: "management" };

  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.dashboard.get"
      use_case: "get_dashboard"
      permissions: "delivery.dashboard.read"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.list"
      use_case: "list_items"
      permissions: "delivery.items.read"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CreateItem(CreateItemRequest) returns (WorkItemResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.create"
      use_case: "create_item"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc UpdateItem(UpdateItemRequest) returns (WorkItemResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.update"
      use_case: "update_item"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CreateItemComment(CreateItemCommentRequest) returns (CommentResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.comment.create"
      use_case: "add_comment"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc UpdateItemContext(UpdateItemContextRequest) returns (WorkItemResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.update-context"
      use_case: "update_item_context"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc AdvanceGate(AdvanceGateRequest) returns (WorkItemResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.advance-gate"
      use_case: "advance_gate"
      permissions: "delivery.items.gate"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CloseItem(CloseItemRequest) returns (WorkItemResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.items.close"
      use_case: "close_item"
      permissions: "delivery.items.close"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CreateProject(CreateProjectRequest) returns (ProjectResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.projects.create"
      use_case: "create_project"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CreateRelease(CreateReleaseRequest) returns (ReleaseResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.releases.create"
      use_case: "create_release"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CreateSprint(CreateSprintRequest) returns (SprintResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.sprints.create"
      use_case: "create_sprint"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
  rpc CreateMilestone(CreateMilestoneRequest) returns (MilestoneResponse) {
    option (yunka.dsl.v1.operation) = {
      id: "delivery.milestones.create"
      use_case: "create_milestone"
      permissions: "delivery.items.write"
      permission_mode: PERMISSION_ALL
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_JWT
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
    };
  }
}

message GetDashboardRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
}

message GetDashboardResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  Dashboard dashboard = 1;
}

message ListItemsRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
}

message ListItemsResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  repeated WorkItem items = 1;
}

message WorkItemResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  WorkItem item = 1;
}
message CommentResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  Comment comment = 1;
}

message ProjectResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  Project project = 1;
}

message ReleaseResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  Release release = 1;
}

message SprintResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  Sprint sprint = 1;
}

message MilestoneResponse {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  Milestone milestone = 1;
}

message Dashboard {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  repeated BoardSummary boards = 1;
  repeated WorkItem items = 2;
  google.protobuf.Timestamp generated_at = 3;
}

message BoardSummary {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string board = 1;
  int32 total = 2;
  int32 active = 3;
  int32 blocked = 4;
  int32 verifying = 5;
  int32 released = 6;
  int32 closed = 7;
}

message Project {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string name = 2;
  string board = 3;
  string owner = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
	string description = 7;
}

message Release {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string project_id = 2;
  string name = 3;
  string version = 4;
  string target_date = 5;
  string status = 6;
  string description = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Sprint {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string project_id = 2;
  string name = 3;
  string goal = 4;
  string start_date = 5;
  string end_date = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Milestone {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string project_id = 2;
  string name = 3;
  string target_date = 4;
  string status = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message WorkItem {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string title = 2;
  string board = 3;
  string type = 4;
  string owner = 5;
  string priority = 6;
  string status = 7;
  string gate = 8;
  string due_date = 9;
  string plan = 10;
  string solution = 11;
  repeated Decision decisions = 12;
  repeated Evidence evidence = 13;
  string retrospective = 14;
  string blocker = 15;
  bool is_sample = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  string project_id = 19;
  string parent_id = 20;
  string kind = 21;
  repeated WorkItemDependency dependencies = 22;
  string release_id = 23;
  string sprint_id = 24;
  string milestone_id = 25;
  string start_date = 26;
  double estimate_points = 27;
  int32 progress_percent = 28;
  repeated IoTBinding iot_bindings = 29;
  repeated TraceLink trace_links = 30;
  repeated Comment comments = 31;
  repeated Activity activities = 32;
}
message WorkItemDependency {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string item_id = 1;
  string relation = 2;
}
message IoTBinding {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string kind = 1;
  string reference = 2;
  string label = 3;
  map<string, string> attributes = 4;
}
message TraceLink {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string kind = 1;
  string reference = 2;
  string title = 3;
  string url = 4;
  string status = 5;
  google.protobuf.Timestamp recorded_at = 6;
}
message Comment {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string body = 2;
  string author = 3;
  google.protobuf.Timestamp created_at = 4;
}
message Activity {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string type = 2;
  string summary = 3;
  string actor = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message Evidence {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string kind = 1;
  string title = 2;
  string reference = 3;
  google.protobuf.Timestamp recorded_at = 4;
}

message Decision {
  option (yunka.dsl.v1.dto) = { kind: DTO_SHARED };
  string id = 1;
  string title = 2;
  string context = 3;
  string outcome = 4;
  string consequences = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateItemRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string title = 1;
  string board = 2;
  string type = 3;
  string owner = 4;
  string priority = 5;
  string due_date = 6;
  string plan = 7;
  string solution = 8;
  bool is_sample = 9;
  string project_id = 10;
  string parent_id = 11;
  string kind = 12;
  repeated WorkItemDependency dependencies = 13;
  string release_id = 14;
  string sprint_id = 15;
  string milestone_id = 16;
  string start_date = 17;
  double estimate_points = 18;
  int32 progress_percent = 19;
  repeated IoTBinding iot_bindings = 20;
  repeated TraceLink trace_links = 21;
}
message UpdateItemRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string id = 1;
  repeated string update_mask = 2;
  string title = 3;
  string owner = 4;
  string priority = 5;
  string release_id = 6;
  string sprint_id = 7;
  string milestone_id = 8;
  string start_date = 9;
  string due_date = 10;
  double estimate_points = 11;
  int32 progress_percent = 12;
  repeated WorkItemDependency dependencies = 13;
  repeated IoTBinding iot_bindings = 14;
  repeated TraceLink trace_links = 15;
}
message CreateItemCommentRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string id = 1;
  string body = 2;
}

message CreateProjectRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string name = 1;
  string board = 2;
  string owner = 3;
	string description = 4;
}

message CreateReleaseRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string project_id = 1;
  string name = 2;
  string version = 3;
  string target_date = 4;
  string status = 5;
  string description = 6;
}

message CreateSprintRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string project_id = 1;
  string name = 2;
  string goal = 3;
  string start_date = 4;
  string end_date = 5;
  string status = 6;
}

message CreateMilestoneRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string project_id = 1;
  string name = 2;
  string target_date = 3;
  string status = 4;
  string description = 5;
}

message UpdateItemContextRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string id = 1;
  optional string plan = 2;
  optional string solution = 3;
  optional string blocker = 4;
  optional Decision decision = 5;
}

message AdvanceGateRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string id = 1;
  string gate = 2;
  repeated Evidence evidence = 3;
}

message CloseItemRequest {
  option (yunka.dsl.v1.dto) = { kind: DTO_INPUT };
  string id = 1;
  string retrospective = 2;
}
